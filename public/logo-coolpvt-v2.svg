<svg width="360" height="100" viewBox="0 0 360 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E65100" />
      <stop offset="100%" style="stop-color:#FF9800" />
    </linearGradient>
  </defs>

  <!-- Compact icon: sun + bolt combined -->
  <circle cx="42" cy="44" r="28" fill="url(#gSun)" />
  <!-- Sun rays -->
  <g stroke="#FFD600" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="42" y1="10" x2="42" y2="4" />
    <line x1="42" y1="78" x2="42" y2="84" />
    <line x1="8" y1="44" x2="2" y2="44" />
    <line x1="76" y1="44" x2="82" y2="44" />
    <line x1="18" y1="20" x2="14" y2="16" />
    <line x1="66" y1="20" x2="70" y2="16" />
    <line x1="18" y1="68" x2="14" y2="72" />
    <line x1="66" y1="68" x2="70" y2="72" />
  </g>
  <!-- Bolt inside sun -->
  <path d="M39 28 L34 46 L41 46 L37 62 L52 42 L44 42 L49 28 Z" fill="white" />

  <!-- Text "Cool" in orange -->
  <text x="92" y="56" font-family="'Segoe UI', Arial, sans-serif" 
        font-size="44" font-weight="900" fill="#E65100" 
        letter-spacing="-1">Cool</text>
  <!-- Text "PVT" in dark -->
  <text x="210" y="56" font-family="'Segoe UI', Arial, sans-serif" 
        font-size="44" font-weight="900" fill="#1a1a2e" 
        letter-spacing="-1">PVT</text>

  <!-- Subtle tagline -->
  <text x="92" y="80" font-family="Arial, sans-serif" font-size="11" 
        fill="#888" letter-spacing="3" 
        font-weight="600">SIMULATOR FOTOVOLTAIC</text>
</svg>
